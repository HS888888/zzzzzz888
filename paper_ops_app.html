<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MS SERVICE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f7f8;
      --surface: #ffffff;
      --border: #e7e9ec;
      --text: #1c1917;
      --muted: #78716c;
      --primary: #1c1917;
      --primary-text: #fafaf9;
      --danger: #b91c1c;
      --danger-bg: #ffffff;
      --danger-border: #fecaca;
      --secondary-bg: #ffffff;
      --secondary-text: #44403c;
      --secondary-border: #d6d3d1;
      --status: #15803d;
      --plc-bg: #ffffff;
      --plc-border: #bbf7d0;
      --plc-led: #16a34a;
      --gw-bg: #ffffff;
      --gw-border: #e7e5e1;
      --gw-strip-bg: #1c1917;
      --gw-strip-text: #fafaf9;
      --gw-led: #16a34a;
      --cust-bg: #ffffff;
      --cust-border: #bfdbfe;
      --cust-led: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app-window {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .app-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      flex-shrink: 0;
      flex-wrap: wrap;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .toolbar .spacer { flex: 1; }

    .btn {
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
      font-family: inherit;
      cursor: pointer;
      transition:
        box-shadow 0.15s ease,
        background-color 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease;
    }
    .btn:hover:not(:disabled) {
      box-shadow: 0 6px 14px rgba(28, 25, 23, 0.12);
    }
    .btn:active:not(:disabled) {
      box-shadow: 0 2px 6px rgba(28, 25, 23, 0.1);
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .btn-primary {
      background: var(--primary);
      color: var(--primary-text);
    }
    .btn-primary:hover:not(:disabled) { background: #292524; }
    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: var(--danger-border);
    }
    .btn-danger:hover:not(:disabled) { background: #fef2f2; border-color: #fca5a5; }
    .btn-secondary {
      background: var(--secondary-bg);
      color: var(--secondary-text);
      border-color: var(--secondary-border);
    }
    .btn-secondary:hover:not(:disabled) { background: #fafaf9; border-color: #a8a29e; }

    .diagram-area {
      flex: 1;
      overflow: hidden;
      padding: 18px 22px;
      min-height: 0;
      margin: 14px;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .diagram-title {
      font-size: 15px;
      font-weight: 450;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      text-align: center;
    }
    .diagram-sub {
      font-size: 12px;
      margin-bottom: 0;
      color: var(--muted);
      text-align: center;
    }
    .diagram-header {
      text-align: center;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .flow {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }
    .flow-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .plc-row {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .block {
      width: 180px;
      padding: 16px 18px 14px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      text-align: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(28, 25, 23, 0.08);
      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        background-color 0.18s ease;
    }
    .block:hover {
      border-color: var(--accent, var(--border));
      box-shadow: 0 14px 32px rgba(28, 25, 23, 0.12);
    }
    .block .led,
    .gw-block .gw-status {
      display: none;
    }
    .block .name {
      display: block;
      font-size: 13px;
      font-weight: 450;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .block .role {
      display: block;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .block .addr {
      display: block;
      font-family: "Geist Mono", Consolas, monospace;
      font-size: 10px;
      color: var(--muted);
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .block-plc.block-idle,
    .block-cust.block-idle,
    .gw-block.block-idle {
      border-color: var(--border);
      box-shadow: 0 8px 24px rgba(28, 25, 23, 0.08);
    }

    .block-plc.block-ok {
      border-color: var(--plc-border);
      box-shadow:
        0 8px 24px rgba(22, 163, 74, 0.2),
        0 0 0 1px rgba(134, 239, 172, 0.35);
    }
    .block-plc.block-ok:hover {
      box-shadow:
        0 14px 32px rgba(22, 163, 74, 0.26),
        0 0 0 1px rgba(134, 239, 172, 0.45);
    }

    .block-plc.block-error {
      border-color: var(--danger-border);
      box-shadow:
        0 8px 24px rgba(185, 28, 28, 0.18),
        0 0 0 1px rgba(252, 165, 165, 0.42);
    }
    .block-plc.block-error:hover {
      --accent: #fca5a5;
      box-shadow:
        0 14px 32px rgba(185, 28, 28, 0.24),
        0 0 0 1px rgba(252, 165, 165, 0.52);
    }

    .block-cust.block-ok {
      border-color: var(--cust-border);
      box-shadow:
        0 8px 24px rgba(37, 99, 235, 0.18),
        0 0 0 1px rgba(191, 219, 254, 0.45);
    }
    .block-cust.block-ok:hover {
      box-shadow:
        0 14px 32px rgba(37, 99, 235, 0.24),
        0 0 0 1px rgba(191, 219, 254, 0.55);
    }

    .block-cust.block-error {
      border-color: var(--danger-border);
      box-shadow:
        0 8px 24px rgba(185, 28, 28, 0.18),
        0 0 0 1px rgba(252, 165, 165, 0.42);
    }
    .block-cust.block-error:hover {
      --accent: #fca5a5;
      box-shadow:
        0 14px 32px rgba(185, 28, 28, 0.24),
        0 0 0 1px rgba(252, 165, 165, 0.52);
    }

    .block-plc:hover { --accent: var(--plc-border); }
    .block-cust { width: 230px; }
    .block-cust:hover { --accent: var(--cust-border); }
    .gw-block:hover { --accent: var(--gw-border); }

    .arrow {
      font-size: 16px;
      line-height: 1;
      color: var(--muted);
      opacity: 0.4;
      font-family: "Geist Mono", monospace;
    }

    .gw-block {
      width: 100%;
      max-width: 640px;
      padding: 18px 22px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      text-align: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(28, 25, 23, 0.08);
      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        background-color 0.18s ease;
    }
    .gw-block:hover {
      border-color: var(--accent, var(--gw-border));
      box-shadow: 0 14px 32px rgba(28, 25, 23, 0.12);
    }
    .gw-block.block-ok {
      border-color: var(--plc-border);
      box-shadow:
        0 8px 24px rgba(22, 163, 74, 0.2),
        0 0 0 1px rgba(134, 239, 172, 0.35);
    }
    .gw-block.block-ok:hover {
      --accent: var(--plc-border);
      box-shadow:
        0 14px 32px rgba(22, 163, 74, 0.26),
        0 0 0 1px rgba(134, 239, 172, 0.45);
    }
    .gw-block.block-error {
      border-color: var(--danger-border);
      box-shadow:
        0 8px 24px rgba(185, 28, 28, 0.18),
        0 0 0 1px rgba(252, 165, 165, 0.42);
    }
    .gw-block.block-error:hover {
      --accent: #fca5a5;
      box-shadow:
        0 14px 32px rgba(185, 28, 28, 0.24),
        0 0 0 1px rgba(252, 165, 165, 0.52);
    }
    .gw-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--gw-strip-bg);
      color: var(--gw-strip-text);
      margin-bottom: 10px;
    }
    .gw-title {
      font-size: 14px;
      font-weight: 450;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .gw-sub {
      font-size: 11px;
      color: var(--muted);
    }
    .gw-addr {
      display: block;
      font-family: "Geist Mono", Consolas, monospace;
      font-size: 10px;
      color: var(--muted);
      padding-top: 8px;
      border-top: 1px solid var(--border);
      margin-top: 10px;
    }

    .legend {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 11px;
      opacity: 0.7;
      flex-shrink: 0;
    }
    .legend span i {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      background: #d6d3d1;
      transition: background-color 0.2s ease;
    }
    .legend span i.ok-plc { background: var(--plc-led); }
    .legend span i.ok-gw { background: var(--gw-led); }
    .legend span i.ok-cust { background: var(--cust-led); }
    .legend span i.error { background: var(--danger); }
    .legend span i.idle { background: #d6d3d1; }
  </style>
</head>
<body>
  <div class="app-window">
    <div class="app-body">
      <div class="toolbar">
        <button class="btn btn-primary" id="btn-start" type="button">Запуск</button>
        <button class="btn btn-danger" id="btn-stop" type="button">Стоп</button>
        <button class="btn btn-secondary" id="btn-save" type="button">Сохранить</button>
        <button class="btn btn-secondary" id="btn-journal" type="button">Журнал</button>
        <span class="spacer"></span>
      </div>

      <div class="diagram-area">
        <div class="flow">
          <div class="diagram-header">
            <div class="diagram-title">Схема OPC UA шлюза</div>
            <div class="diagram-sub">Нажмите на блок для настройки · при запуске: зелёная/синяя тень — OK · красная — нет данных</div>
          </div>
          <div class="flow-body">
          <div class="plc-row" id="plc-row">
            <div class="block block-plc block-idle" data-index="0">
              <span class="led"></span>
              <span class="name">ОВЕН210 #1</span>
              <span class="role">ПЛК</span>
              <span class="addr">—</span>
            </div>
            <div class="block block-plc block-idle" data-index="1">
              <span class="led"></span>
              <span class="name">ОВЕН210 #2</span>
              <span class="role">ПЛК</span>
              <span class="addr">—</span>
            </div>
            <div class="block block-plc block-idle" data-index="2">
              <span class="led"></span>
              <span class="name">ОВЕН210 #3</span>
              <span class="role">ПЛК</span>
              <span class="addr">—</span>
            </div>
          </div>
          <div class="arrow">↓</div>
          <div class="gw-block block-idle" id="gw-block">
            <span class="gw-status"></span>
            <span class="gw-badge">Шлюз</span>
            <div class="gw-title">MS SERVICE</div>
            <div class="gw-addr" id="gw-addr">—</div>
          </div>
          <div class="arrow">↓</div>
          <div class="block block-cust block-idle" id="cust-block">
            <span class="led"></span>
            <span class="name">Клиент заказчика</span>
            <span class="role">SCADA / MES</span>
            <span class="addr">UaExpert · SCADA · MES</span>
          </div>
          <div class="legend">
            <span><i id="legend-plc" class="idle"></i>ПЛК</span>
            <span><i id="legend-gw" class="idle"></i>Шлюз</span>
            <span><i id="legend-cust" class="idle"></i>Клиент</span>
          </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    let bridge = null;

    function bindBlockClicks() {
      document.querySelectorAll(".block-plc").forEach((block) => {
        block.addEventListener("click", () => {
          if (bridge) bridge.openBlock("plc", Number(block.dataset.index));
        });
      });
    }

    function setLegendDot(id, ok, running, configured, okClass) {
      const dot = document.getElementById(id);
      if (!dot) return;
      dot.classList.remove("ok-plc", "ok-gw", "ok-cust", "error", "idle");
      if (!running || configured === false) {
        dot.classList.add("idle");
        return;
      }
      dot.classList.add(ok ? okClass : "error");
    }

    function updateLegend(diagram, running) {
      const plcs = diagram.plcs || [];
      const active = plcs.filter((plc) => plc.configured !== false);
      const plcOk = active.some((plc) => plc.ok);
      setLegendDot("legend-plc", plcOk, running, active.length > 0, "ok-plc");
      setLegendDot(
        "legend-gw",
        !!(diagram.gateway && diagram.gateway.ok),
        running,
        true,
        "ok-gw"
      );
      setLegendDot(
        "legend-cust",
        !!(diagram.customer && diagram.customer.ok),
        running,
        true,
        "ok-cust"
      );
    }

    function setBlockStatus(block, ok, running, configured) {
      block.classList.remove("block-ok", "block-error", "block-idle");
      if (!running || configured === false) {
        block.classList.add("block-idle");
        return;
      }
      block.classList.add(ok ? "block-ok" : "block-error");
    }

    function updatePlcRow(plcs, running) {
      const row = document.getElementById("plc-row");
      plcs.forEach((plc, index) => {
        const block = row.children[index];
        if (!block) return;
        const configured = plc.configured !== false;
        setBlockStatus(block, !!plc.ok, running, configured);
        block.querySelector(".name").textContent = plc.name;
        block.querySelector(".addr").textContent = plc.addr;
      });
    }

    window.applyAppState = function(state) {
      if (!state) return;

      if (state.buttons) {
        document.getElementById("btn-start").disabled = !state.buttons.start;
        document.getElementById("btn-stop").disabled = !state.buttons.stop;
        document.getElementById("btn-save").disabled = !state.buttons.save;
      }

      if (state.diagram) {
        const running = !!state.diagram.running;
        if (state.diagram.plcs) updatePlcRow(state.diagram.plcs, running);
        if (state.diagram.gateway && state.diagram.gateway.addr) {
          document.getElementById("gw-addr").textContent = state.diagram.gateway.addr;
        }
        const gw = document.getElementById("gw-block");
        setBlockStatus(gw, !!(state.diagram.gateway && state.diagram.gateway.ok), running);
        const cust = document.getElementById("cust-block");
        setBlockStatus(cust, !!(state.diagram.customer && state.diagram.customer.ok), running);
        updateLegend(state.diagram, running);
      }
    };

    function bindUi() {
      document.addEventListener("contextmenu", (event) => event.preventDefault());
      document.getElementById("btn-start").addEventListener("click", () => bridge && bridge.startGateway());
      document.getElementById("btn-stop").addEventListener("click", () => bridge && bridge.stopGateway());
      document.getElementById("btn-save").addEventListener("click", () => bridge && bridge.saveSettings());
      document.getElementById("btn-journal").addEventListener("click", () => bridge && bridge.openLog());
      document.getElementById("gw-block").addEventListener("click", () => bridge && bridge.openBlock("gateway", -1));
      document.getElementById("cust-block").addEventListener("click", () => bridge && bridge.openBlock("customer", -1));
      bindBlockClicks();
    }

    if (typeof qt !== "undefined") {
      new QWebChannel(qt.webChannelTransport, function(channel) {
        bridge = channel.objects.bridge;
        bindUi();
        if (bridge.requestState) bridge.requestState();
      });
    } else {
      bindUi();
    }
  </script>
</body>
</html>
